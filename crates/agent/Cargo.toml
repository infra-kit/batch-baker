[package]
name = "batch-baker-agent"
version = "0.1.0"
edition = "2021"
description = "Guest helper: delta apply and TTL destroy"
license = "MIT OR Apache-2.0"

[[bin]]
name = "batch-baker-agent"
path = "src/main.rs"

[dependencies]
batch-baker-proto = { path = "../proto" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
